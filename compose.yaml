services:

  # ── Instance Basic (plan basic) ──────────────────────────────────
  api_basic:
    build: ./backend
    container_name: pharmagest_basic
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./docker/basic.env
    environment:
      INSTANCE_NAME: basic
      WORKERS: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Instance Pro (plan pro) ───────────────────────────────────────
  api_pro:
    build: ./backend
    container_name: pharmagest_pro
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - ./docker/pro.env
    environment:
      INSTANCE_NAME: pro
      WORKERS: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Instance Enterprise ───────────────────────────────────────────
  api_enterprise:
    build: ./backend
    container_name: pharmagest_enterprise
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - ./docker/enterprise.env
    environment:
      INSTANCE_NAME: enterprise
      WORKERS: "4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx — Reverse Proxy & Routeur ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pharmagest_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_basic
      - api_pro
      - api_enterprise
