[pytest]
# ── Configuration Pytest — PharmaGestion ─────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosité et rapport
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --durations=10
    -p no:warnings

# Marqueurs personnalisés
markers =
    unit: Tests unitaires (pas de DB, pas de réseau)
    integration: Tests d'intégration (DB SQLite mémoire)
    security: Tests de sécurité
    auth: Tests d'authentification
    pricing: Tests du module tarification
    stock: Tests du module stock
    slow: Tests lents (> 1 seconde)
