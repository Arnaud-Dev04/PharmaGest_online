<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aperçu complet PharmaERP</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet"><style>/* Layout idea: dark pharmacy-navy rail on the left, light working surface on the right, dense but calm cards. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface-2:#F6F9F8; --ink:#0E1B2C; --ink-2:#3F5066; --mute:#69798B;
  --line:#E0E7E5; --line-2:#ECF1F0;
  --brand:#0B7F78; --brand-600:#096A64; --brand-50:#E2F3F1; --on-brand:#FFFFFF;
  --side:#0D1B2A; --side-2:#16293D; --side-ink:#C9D4DF; --side-mute:#7F91A5;
  --crit:#C2321F; --crit-50:#FDEDEA; --warn:#A8510A; --warn-50:#FEF3DD; --good:#15803D; --good-50:#E2F5E8; --info:#2150C8; --info-50:#E7EDFC;
  --c1:#0C9B82; --c2:#3B6FE0; --c3:#D4780A; --c4:#8B5CF6; --c5:#8A94A6; --grid:#E3E9E7;
  --shadow:0 1px 2px rgba(14,27,44,.05),0 8px 24px rgba(14,27,44,.05);
  --r:14px; --r-sm:10px;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Sora','Figtree',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A121B; --surface:#111D2A; --surface-2:#15232F; --ink:#E8EEF4; --ink-2:#B4C2D1; --mute:#8799AB;
    --line:#233446; --line-2:#1A2B3B;
    --brand:#2DB5A8; --brand-600:#4AC7BB; --brand-50:#12342F; --on-brand:#04201D;
    --side:#07111B; --side-2:#102030;
    --crit:#F0705E; --crit-50:#3A1A18; --warn:#E5A04B; --warn-50:#372713; --good:#4CC07A; --good-50:#14301F; --info:#7C9CF5; --info-50:#18264A;
    --c1:#1FA38E; --c2:#5B8CF5; --c3:#CF8222; --c4:#9B7BF0; --c5:#8EA0B4; --grid:#1E3041;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A121B; --surface:#111D2A; --surface-2:#15232F; --ink:#E8EEF4; --ink-2:#B4C2D1; --mute:#8799AB;
  --line:#233446; --line-2:#1A2B3B;
  --brand:#2DB5A8; --brand-600:#4AC7BB; --brand-50:#12342F; --on-brand:#04201D;
  --side:#07111B; --side-2:#102030;
  --crit:#F0705E; --crit-50:#3A1A18; --warn:#E5A04B; --warn-50:#372713; --good:#4CC07A; --good-50:#14301F; --info:#7C9CF5; --info-50:#18264A;
  --c1:#1FA38E; --c2:#5B8CF5; --c3:#CF8222; --c4:#9B7BF0; --c5:#8EA0B4; --grid:#1E3041;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}.i.lg{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
#app{display:grid;grid-template-columns:252px 1fr;height:100%}
#side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.brand b{display:block;font-family:var(--f-disp);font-size:17px;color:#fff;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--side-mute)}
.navgroup{margin:14px 10px 6px;font-size:11.5px;color:var(--side-mute);font-weight:600;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;color:var(--side-ink);border-radius:10px;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:var(--side-2);color:#fff}
.nav button[aria-current="page"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--crit);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.nav button[aria-current="page"] .badge{background:#fff;color:var(--brand-600)}
.sidefoot{margin-top:auto;padding-top:14px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side-2);width:100%;border:0;color:#fff;text-align:left}
.me small{display:block;color:var(--side-mute);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;position:relative}
.av.sm{width:30px;height:30px;font-size:12px}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#22C55E;border:2px solid var(--side-2)}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
#top .ttl{min-width:0}
#top h1{font-size:21px;white-space:nowrap}
#top .sub{font-size:12.5px;color:var(--mute)}
.gsearch{flex:1;max-width:520px;margin-left:auto;position:relative}
.field{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;color:var(--mute)}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.field input{border:0;background:none;outline:0;flex:1;min-width:0;height:100%;color:var(--ink)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;position:relative;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.userbtn{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:300px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(8,20,34,.18);padding:8px;z-index:50}
.gsearch .menu{left:0;right:0}
.menu h4{font-size:12px;color:var(--mute);padding:8px 10px 4px;font-family:var(--f-body);font-weight:600}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;text-align:left}
.mi:hover,.mi[aria-selected="true"]{background:var(--surface-2)}
.mi small{display:block;color:var(--mute)}
.menuwrap{position:relative}
#menubtn{display:none}
#view{flex:1;overflow:auto;padding:26px 28px 40px;min-height:0}
.page{max-width:1380px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead h2{font-size:24px}
.pagehead p{color:var(--mute);margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0;flex-wrap:wrap}
.card>.hd h3{font-size:16px}
.card>.hd p{color:var(--mute);font-size:13px;margin-top:2px}
.card>.bd{padding:16px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-600);border-color:var(--brand-600);color:var(--on-brand)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.danger:hover{filter:brightness(.92);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-50)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.crit{background:var(--crit-50);color:var(--crit)}.pill.warn{background:var(--warn-50);color:var(--warn)}
.pill.good{background:var(--good-50);color:var(--good)}.pill.info{background:var(--info-50);color:var(--info)}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;color:var(--ink-2);white-space:nowrap}
.rx{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid var(--info);color:var(--info);font-size:11px;font-weight:700}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--mute);height:32px;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .n{font-size:12px;background:var(--line-2);border-radius:8px;padding:0 6px;color:var(--ink-2)}
.input,.select,.textarea{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px;outline:0;color:var(--ink)}
.textarea{height:84px;padding:10px 12px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
label.lb{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--brand)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.chk{width:18px;height:18px;accent-color:var(--brand)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--mute);text-align:left;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
th button{border:0;background:none;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center;padding:0}
th button:hover{color:var(--brand)}
td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.hl td{background:var(--crit-50)}
tbody tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.med b{display:block}.med small{color:var(--mute)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px;min-width:80px}
.meter i{display:block;height:100%;border-radius:3px}

/* kpi */
.kpi{padding:18px 18px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--brand))}
.kpi .lab{font-size:13px;color:var(--mute);font-weight:600}
.kpi .val{font-family:var(--f-disp);font-size:28px;font-weight:600;margin:4px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .ico{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--kb,var(--brand-50));color:var(--k,var(--brand))}
.kpi .foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.delta{font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--good)}.delta.down{color:var(--crit)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qa button{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);text-align:left;box-shadow:var(--shadow)}
.qa button:hover{border-color:var(--brand)}
.qa .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.qa b{display:block;font-weight:600}.qa small{color:var(--mute)}

.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.mini small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.mini b{font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;font-weight:600;font-size:13px}
.banner.good{background:var(--good-50);color:var(--good)}.banner.crit{background:var(--crit-50);color:var(--crit)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--mute);font-size:11px;font-family:var(--f-body)}
svg.chart .grid{stroke:var(--grid);stroke-dasharray:3 4}
svg.chart .hit{fill:transparent}
svg.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 24px rgba(8,20,34,.2);border-radius:10px;padding:8px 11px;font-size:12.5px;display:none;max-width:260px}
#tip b{display:block;margin-bottom:2px}
#tip .sq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);position:relative}
.alert .ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.alert.crit{background:var(--crit-50);border-color:transparent}.alert.crit .ai{background:var(--crit);color:#fff}
.alert.warn{background:var(--warn-50);border-color:transparent}.alert.warn .ai{background:var(--warn);color:#fff}
.alert.info{background:var(--info-50);border-color:transparent}.alert.info .ai{background:var(--info);color:#fff}
.alert b{display:block;font-weight:600}
.alert p{color:var(--ink-2);font-size:13px}
.alert .ft{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.xbtn{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--mute);width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.xbtn:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.feed .it:last-child{border-bottom:0}
.feed .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand)}
.feed b{font-weight:600;display:block}.feed small{color:var(--mute)}
.reco{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}

/* pos */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.prod{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:138px;box-shadow:var(--shadow)}
.prod:hover:not(:disabled){border-color:var(--brand)}
.prod:disabled{opacity:.55;cursor:not-allowed}
.prod b{font-weight:600;line-height:1.25}
.prod .pr{font-family:var(--f-disp);font-weight:600;font-size:18px;color:var(--brand)}
.prod .add{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.prod .tagrow{display:flex;gap:6px;flex-wrap:wrap;padding-right:34px;min-height:24px}
.cart{position:sticky;top:0;display:flex;flex-direction:column;gap:12px;padding:18px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:28px;height:28px;display:grid;place-items:center}
.qty button:hover{color:var(--brand)}
.qty span{min-width:30px;text-align:center;font-weight:600}
.tot{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.tot.big{font-family:var(--f-disp);font-weight:600;font-size:20px;color:var(--ink);padding-top:8px;border-top:1px solid var(--line)}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--mute)}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(7,17,27,.55)}
#modal.open{display:flex}
.dlg{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dlg.wide{max-width:760px}
.dlg .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dlg .dh h3{font-size:18px}.dlg .dh p{color:var(--mute);font-size:13px;margin-top:2px}
.dlg .db{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.dlg .df{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px}
.dlg .df .btn{min-width:110px}
.estimate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:12px;background:var(--good-50);color:var(--good)}
.estimate b{font-family:var(--f-disp);font-size:20px}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.55}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:600;display:flex;gap:10px;align-items:center;animation:tin .18s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.sw i,.sw i::after{transition:none}}

.sup{padding:18px;display:flex;flex-direction:column;gap:12px}
.sup dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.sup dt{color:var(--mute)}.sup dd{margin:0;font-weight:500}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.staff{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.staff:last-child{border-bottom:0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--mute)}
.panel-empty{display:grid;place-items:center;text-align:center;gap:10px;color:var(--mute);min-height:260px;padding:20px}

@media (max-width:1180px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .cols,.pos{grid-template-columns:1fr}
  .cart{position:static}
  .qa{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:270px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  #app.nav-open #side{transform:none}
  #scrim{display:none;position:fixed;inset:0;background:rgba(7,17,27,.5);z-index:80}
  #app.nav-open #scrim{display:block}
  #menubtn{display:grid}
  #top{padding:12px 16px;gap:10px;flex-wrap:wrap}
  .gsearch{order:5;flex-basis:100%;max-width:none;margin-left:0}
  #top .ttl{flex:1}
  #view{padding:18px 16px 32px}
  .userbtn .nm{display:none}
}
@media (max-width:620px){
  .grid2,.grid3,.mini3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr}
  .qa{grid-template-columns:1fr}
  .menu{min-width:0;width:calc(100vw - 32px);right:-8px}
}

/* corrections de lisibilité */
tbody tr.hl .pill.crit{background:var(--surface)}
td.num,.num.nw{white-space:nowrap}

/* ===== Section Gestion : analytique, ventes, fournisseurs, équipe, paramètres ===== */
.toplist{display:flex;flex-direction:column;gap:10px}
.toprow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.toprow:nth-child(even){background:var(--surface-2)}
.rank{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;background:var(--brand);color:var(--on-brand)}
.toprow small{display:block;color:var(--mute)}
.toprow .amt{text-align:right;font-weight:700}
.chartgrid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:20px;align-items:start}
.legend.col{flex-direction:column;gap:8px;margin-top:12px}
.legend.col span{display:flex;align-items:center;justify-content:space-between;gap:12px}
.legend.col span b{font-variant-numeric:tabular-nums}
.rolepill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.rolepill.admin{color:var(--crit)}.rolepill.pharma{color:var(--good)}.rolepill.inv{color:var(--info)}.rolepill.cash{color:var(--warn)}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
.setgroup{display:flex;gap:14px}
.setgroup>.ico{width:40px;height:40px;border-radius:11px;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:none}
.setgroup .body{flex:1;min-width:0}
.setgroup h3{font-size:16px}.setgroup p.d{color:var(--mute);font-size:13px;margin:2px 0 8px}
@media (max-width:1180px){.chartgrid{grid-template-columns:1fr}}

#scrim{display:none}[hidden]{display:none!important}#app{height:100vh}
@media (max-width:900px){#app.nav-open #scrim{display:block}}

})();

  if(!n)return e.textContent='Saisissez le nom du médicament.';if(!c)return e.textContent='Choisissez ou saisissez une catégorie.';if(!(p>0))return e.textContent='Le prix de vente doit être supérieur à 0.';if(!(k>=0))return e.textContent="Saisissez le prix d'achat.";if(k>p)return e.textContent="Le prix d'achat dépasse le prix de vente : vérifiez les montants.";
  if(id){const m=medById(+id);Object.assign(m,{n,cat:c,price:p,cost:k,min:mn||0,sup:+$('#f-s').value,rx:$('#f-rx').checked});toast('Médicament mis à jour');logAct('box','Fiche modifiée',n)}
  else{const q=parseInt($('#f-q').value)||0,lot=$('#f-lot').value.trim()||'LOT-'+(SEQ+1),ex=$('#f-e').value;if(!ex)return e.textContent="Indiquez la date d'expiration du lot.";
   const m={id:++SEQ,n,cat:c,price:p,cost:k,min:mn||0,sup:+$('#f-s').value,rx:$('#f-rx').checked,bc:'6221'+String(100000000+SEQ*7919311).slice(0,9),lots:q>0?[{lot,exp:parseD(ex),q}]:[]};MEDS.push(m);toast('Médicament ajouté à l\'inventaire');logAct('box','Nouveau médicament',n)}
  closeDlg();render()},
 order:t=>orderDlg(+t.dataset.id),
 prio:t=>{$$('#o-prio button').forEach(b=>b.setAttribute('aria-pressed',b===t));setEta()},
 'order-save':()=>{const mid=+$('#o-mid').value,m=medById(mid),q=parseInt($('#o-qty').value),eta=$('#o-eta').value;if(!(q>0))return $('#o-err').textContent='Saisissez une quantité supérieure à 0.';if(!eta)return $('#o-err').textContent='Choisissez une date de livraison.';
  const o={id:nextOrderId(),mid,sup:+$('#o-sup').value,qty:q,prio:$('#o-prio button[aria-pressed=true]').dataset.v,eta:parseD(eta),cost:q*m.cost,st:'open'};ORDERS.unshift(o);logAct('truck','Commande passée',`${q} × ${m.n} · ${supById(o.sup).n}`);closeDlg();render();toast(`Commande ${o.id} passée : ${q} × ${m.n}`)},
 'order-crit':()=>{const list=MEDS.filter(m=>['critique','rupture'].includes(status(m))&&!ORDERS.some(o=>o.mid===m.id&&o.st==='open')).sort(byUrg);
  if(!list.length)return toast('Aucune référence critique sans commande en cours');
  openDlg(dlg('Commander les critiques',`${list.length} référence${list.length>1?'s':''} en rupture ou en stock critique, sans commande en cours`,`<div class="tw"><table><thead><tr><th>Médicament</th><th>Fournisseur</th><th>Quantité</th><th class="right">Coût</th></tr></thead><tbody>${list.map(m=>`<tr><td class="med"><b>${esc(m.n)}</b><small>Stock ${stock(m)}</small></td><td>${esc(supById(m.sup).n)}</td><td class="num">${suggest(m)}</td><td class="right num">${eg(suggest(m)*m.cost)}</td></tr>`).join('')}</tbody></table></div><div class="estimate"><span>Total estimé (hors taxes)</span><b>${eg(sum(list,m=>suggest(m)*m.cost))}</b></div>`,`<button class="btn" data-a="close">Annuler</button><button class="btn primary" data-a="order-crit-ok">${I('cart','sm')}Passer ${list.length} commande${list.length>1?'s':''}</button>`,true))},
 'order-crit-ok':()=>{const list=MEDS.filter(m=>['critique','rupture'].includes(status(m))&&!ORDERS.some(o=>o.mid===m.id&&o.st==='open'));list.forEach(m=>{const s=supById(m.sup),q=suggest(m);ORDERS.unshift({id:nextOrderId(),mid:m.id,sup:m.sup,qty:q,prio:'Urgent',eta:addDays(Math.max(1,Math.ceil(s.lead/2))),cost:q*m.cost,st:'open'})});logAct('truck','Commandes groupées',list.length+' références critiques commandées');closeDlg();render();toast(list.length+' commandes passées')},
 review:()=>{const al=alerts();openDlg(dlg('Revue des actions',`${al.length} élément${al.length>1?'s':''} à traiter`,`<div class="alerts">${al.map(a=>`<div class="alert ${a.sev}"><div class="ai">${I(a.kind==='stock'?'box':'clock')}</div><div><b>${esc(a.t)}</b><p>${esc(a.x)}</p><div class="ft">${a.kind==='stock'?`<button class="btn sm primary" data-a="order" data-id="${a.m.id}">Commander</button>`:lotSt(a.l).k==='expired'?`<button class="btn sm primary" data-a="writeoff" data-m="${a.m.id}" data-lot="${a.l.lot}">Retirer du stock</button>`:`<button class="btn sm primary" data-a="go" data-v="ex" data-xf="soon">Voir le suivi</button>`}</div></div></div>`).join('')||'<div class="empty">Rien à traiter.</div>'}</div>`,`<button class="btn" data-a="close">Fermer</button>`,true))},
 receive:t=>{const o=ORDERS.find(x=>x.id===t.dataset.id),m=medById(o.mid);openDlg(dlg('Réceptionner '+o.id,`${esc(m.n)} · ${esc(supById(o.sup).n)}`,`<div class="grid3"><div><label class="lb" for="r-lot">Numéro de lot</label><input id="r-lot" class="input" value="REC-${o.id.slice(4)}"></div><div><label class="lb" for="r-q">Quantité reçue</label><input id="r-q" class="input" inputmode="numeric" value="${o.qty}"></div><div><label class="lb" for="r-e">Expiration</label><input id="r-e" class="input" type="date" value="${isoD(addDays(540))}"></div></div>${err('r-err')}<input type="hidden" id="r-id" value="${o.id}">`,`<button class="btn" data-a="close">Annuler</button><button class="btn primary" data-a="receive-ok">${I('check','sm')}Ajouter au stock</button>`))},
 'receive-ok':()=>{const o=ORDERS.find(x=>x.id===$('#r-id').value),m=medById(o.mid),q=parseInt($('#r-q').value),e=$('#r-e').value;if(!(q>0))return $('#r-err').textContent='Saisissez la quantité reçue.';if(!e)return $('#r-err').textContent="Indiquez la date d'expiration du lot.";if(parseD(e)<=TODAY)return $('#r-err').textContent="Ce lot est déjà expiré : refusez la livraison ou corrigez la date.";
  m.lots.push({lot:$('#r-lot').value.trim()||'REC',exp:parseD(e),q});o.st='done';logAct('box','Réception de commande',`${q} × ${m.n} ajoutés au stock`);closeDlg();render();toast(`${q} unités de ${m.n} ajoutées au stock`)},
 'ord-cancel':t=>{const i=ORDERS.findIndex(x=>x.id===t.dataset.id);ORDERS.splice(i,1);render();toast('Commande annulée')},
 ordtab:t=>{U.ordTab=t.dataset.v;render()},
 ist:t=>{U.ist=t.dataset.v;render()},'inv-reset':()=>{U.iq='';U.icat='all';U.ist='all';render()},
 xf:t=>{U.xf=t.dataset.v;render()},
 writeoff:t=>{const m=medById(+t.dataset.m),l=m.lots.find(x=>x.lot===t.dataset.lot);openDlg(dlg('Retirer le lot du stock',`${esc(m.n)} · lot ${esc(l.lot)}`,`<p>${l.q} unités expirées le ${fd(l.exp)} seront retirées du stock et comptées en perte.</p><div class="estimate" style="background:var(--crit-50);color:var(--crit)"><span>Valeur perdue (prix d'achat)</span><b>${eg(l.q*m.cost)}</b></div><input type="hidden" id="w-m" value="${m.id}"><input type="hidden" id="w-l" value="${esc(l.lot)}">`,`<button class="btn" data-a="close">Annuler</button><button class="btn danger" data-a="writeoff-ok">${I('trash','sm')}Retirer ${l.q} unités</button>`))},
 'writeoff-ok':()=>{const m=medById(+$('#w-m').value),i=m.lots.findIndex(x=>x.lot===$('#w-l').value),l=m.lots[i];WRITEOFF+=l.q*m.cost;m.lots.splice(i,1);logAct('trash','Lot retiré du stock',`${l.q} × ${m.n} (lot ${l.lot})`);closeDlg();render();toast(`Lot ${l.lot} retiré : ${eg(l.q*m.cost)} passés en perte`)},
 'cli-new':cliDlg,
 'cli-save':()=>{const n=$('#c-n').value.trim(),p=$('#c-p').value.trim(),e=$('#c-e').value.trim(),er=$('#c-err');if(!n)return er.textContent='Saisissez le nom du client.';if(p.replace(/\D/g,'').length<10)return er.textContent='Saisissez un numéro de téléphone valide (10 chiffres minimum).';if(CLI.some(c=>c.ph.replace(/\s/g,'')===p.replace(/\s/g,'')))return er.textContent='Ce numéro est déjà enregistré.';
  const c={id:CLI.length+1,n,ph:p,e:e||'—',tot:0,cnt:0,last:'Jamais'};CLI.push(c);U.csel=c.id;logAct('users','Nouveau client enregistré',n+' a été ajouté');closeDlg();go('cl');toast('Client ajouté : '+n)},
 'cli-sel':t=>{U.csel=+t.dataset.id;render()},
 'cli-sale':t=>{const c=CLI.find(x=>x.id===+t.dataset.id);U.cn=c.n;U.cp=c.ph;go('pos')},
 'sup-new':supDlg,
 'sup-save':()=>{const n=$('#u-n').value.trim(),c=$('#u-c').value.trim(),p=$('#u-p').value.trim(),l=parseInt($('#u-l').value);if(!n)return $('#u-err').textContent="Saisissez le nom de l'entreprise.";if(!c)return $('#u-err').textContent='Saisissez un contact.';if(!(l>0))return $('#u-err').textContent='Le délai doit être d\'au moins 1 jour.';SUP.push({id:SUP.length+1,n,c,ph:p||'—',lead:l});closeDlg();render();toast('Fournisseur ajouté : '+n)},
 'sup-view':t=>{const s=supById(+t.dataset.id),ms=MEDS.filter(m=>m.sup===s.id),os=ORDERS.filter(o=>o.sup===s.id&&o.st==='open');
  openDlg(dlg(esc(s.n),`${esc(s.c)} · ${esc(s.ph)} · livraison en ${s.lead} jours`,`<div><h4 style="font-size:14px;margin-bottom:8px">Produits fournis (${ms.length})</h4>${ms.length?`<div class="tw"><table><tbody>${ms.map(m=>`<tr><td class="med"><b>${esc(m.n)}</b><small>Stock ${stock(m)}</small></td><td>${stPill(m)}</td><td class="right"><button class="btn sm" data-a="order" data-id="${m.id}">Commander</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun produit rattaché à ce fournisseur.</div>'}</div><div><h4 style="font-size:14px;margin-bottom:8px">Commandes en cours (${os.length})</h4>${os.map(o=>`<div class="row between" style="padding:6px 0"><span><b>${o.id}</b> · ${o.qty} × ${esc(medById(o.mid).n)}</span><span class="mute">Livraison ${fd(o.eta)}</span></div>`).join('')||'<span class="mute">Aucune commande en cours.</span>'}</div>`,`<button class="btn primary" data-a="close">Fermer</button>`,true))},
 'staff-new':()=>staffDlg(),'staff-edit':t=>staffDlg(+t.dataset.id),
 'staff-save':()=>{const id=$('#t-id').value,r=$('#t-r').value;if(id){const s=STAFF.find(x=>x.id===+id);s.role=r;const on=$('#t-on');if(on)s.on=on.checked;toast('Accès mis à jour : '+s.n)}else{const n=$('#t-n').value.trim(),e=$('#t-e').value.trim();if(!n)return $('#t-err').textContent='Saisissez le nom du membre.';if(!/^\S+@\S+\.\S+$/.test(e))return $('#t-err').textContent='Saisissez une adresse e-mail valide.';if(STAFF.some(x=>x.e===e))return $('#t-err').textContent='Cette adresse e-mail existe déjà.';STAFF.push({id:STAFF.length+1,n,e,role:r,on:true});toast('Membre ajouté : '+n)}
  if(!curUser().on)U.user=1;closeDlg();render()},
 pwd:()=>openDlg(dlg('Changer le mot de passe','Au moins 8 caractères, avec un chiffre',`<div><label class="lb" for="p0">Mot de passe actuel</label><input id="p0" class="input" type="password" autocomplete="current-password"></div><div class="grid2"><div><label class="lb" for="p1">Nouveau mot de passe</label><input id="p1" class="input" type="password" autocomplete="new-password"></div><div><label class="lb" for="p2">Confirmation</label><input id="p2" class="input" type="password" autocomplete="new-password"></div></div>${err('p-err')}<small class="mute">Aperçu : aucun mot de passe n'est enregistré.</small>`,`<button class="btn" data-a="close">Annuler</button><button class="btn primary" data-a="pwd-ok">Mettre à jour</button>`)),
 'pwd-ok':()=>{const a=$('#p0').value,b=$('#p1').value,c=$('#p2').value,e=$('#p-err');if(!a)return e.textContent='Saisissez votre mot de passe actuel.';if(b.length<8||!/\d/.test(b))return e.textContent='Le nouveau mot de passe doit contenir 8 caractères et un chiffre.';if(b!==c)return e.textContent='Les deux mots de passe ne correspondent pas.';closeDlg();toast('Mot de passe validé (simulation)')},
 aper:t=>{U.aper=t.dataset.v;render()},salpay:t=>{U.salpay=t.dataset.v;render()},
 receipt:t=>{U.menu=null;receiptDlg(t.dataset.id);renderTop()},
 pcat:t=>{U.pcat=t.dataset.v;render()},
 padd:t=>cartAdd(+t.dataset.id,1),qplus:t=>cartAdd(+t.dataset.id,1),qminus:t=>{const id=+t.dataset.id,n=(CART.get(id)||0)-1;if(n<=0)CART.delete(id);else CART.set(id,n);render()},qdel:t=>{CART.delete(+t.dataset.id);render()},
 'cart-clear':()=>{CART.clear();U.rxok=false;render()},pay:t=>{U.pay=t.dataset.v;render()},
 exact:()=>{const tot=cartTotal();U.paid=nf2.format(tot).replace(/ /g,'');render()},
 checkout:()=>{const lines=[...CART].map(([id,n])=>({m:medById(id),n})),net=sum(lines,l=>l.m.price*l.n),tax=net*SET.tax/100,tot=net+tax,paid=U.pay==='Carte'?tot:parseFloat(String(U.paid).replace(',','.'))||0;
  lines.forEach(({m,n})=>{let left=n;m.lots.filter(l=>daysTo(l.exp)>=0).sort((a,b)=>a.exp-b.exp).forEach(l=>{const t=Math.min(l.q,left);l.q-=t;left-=t});m.lots=m.lots.filter(l=>l.q>0||daysTo(l.exp)<0)});
  const s={id:'INV-'+(INV++),ts:new Date(2026,9,28,new Date().getHours(),new Date().getMinutes()),cust:U.cn.trim(),pay:U.pay,items:lines.map(({m,n})=>({id:m.id,n:m.n,q:n,p:m.price,c:m.cost})),net,cost:sum(lines,l=>l.m.cost*l.n),tax,total:tot,paid};
  SALES.unshift(s);NEWNET+=net;NEWCOUNT++;const c=CLI.find(x=>x.n===s.cust);if(c){c.tot+=tot;c.cnt++;c.last='28 oct. 2026'}
  logAct('cart','Vente conclue',`Facture ${s.id} · ${eg(tot,1)}`);CART.clear();U.paid='';U.rxok=false;U.cn='';U.cp='';render();receiptDlg(s.id,true);
  const low=lines.filter(({m})=>['critique','rupture'].includes(status(m)));if(low.length)toast(`Stock critique : ${low.map(l=>l.m.n).join(', ')}`)}
};
const cartTotal=()=>{const sub=sum([...CART],([id,n])=>medById(id).price*n);return sub*(1+SET.tax/100)};
function cartAdd(id,d){const m=medById(id),n=(CART.get(id)||0)+d,s=stock(m);if(n>s)return toast(`Stock insuffisant : ${s} unité${s>1?'s':''} disponible${s>1?'s':''} pour ${m.n}`);CART.set(id,n);render()}

/* ================= événements ================= */
document.addEventListener('click',e=>{
  const mod=$('#modal');if(e.target===mod){closeDlg();return}
  const t=e.target.closest('[data-a]');
  if(t&&A[t.dataset.a]){e.preventDefault();A[t.dataset.a](t);return}
  if(U.menu&&!e.target.closest('.menuwrap')&&!e.target.closest('.gsearch')&&!e.target.closest('.me')){U.menu=null;renderTop()}
  if(e.target.id==='scrim')$('#app').classList.remove('nav-open')});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.in){U[t.dataset.in]=t.value;if(t.dataset.in==='gq'){U.menu=t.value.trim().length>1?'search':null;renderTop();const g=$('#gq');g.focus();g.setSelectionRange(t.value.length,t.value.length)}else render()}
  else if(t.dataset.set){const v=parseFloat(t.value.replace(',','.'));if(v>=0&&v<=100000)SET[t.dataset.set]=v;render()}
  else if(t.hasAttribute('data-oc'))orderCalc()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.chk){U[t.dataset.chk]=t.checked;render()}
  else if(t.dataset.sw){SET[t.dataset.sw]=t.checked;if(t.dataset.sw==='report'&&t.checked){logAct('file','Résumé quotidien activé','Résumé des ventes ajouté chaque soir')}render();toast(t.checked?'Option activée':'Option désactivée')}
  else if(t.dataset.sel){U[t.dataset.sel]=t.value;render()}
  else if(t.dataset.perm){const [r,k]=t.dataset.perm.split('|');t.checked?PERM[r].add(k):PERM[r].delete(k);if(!can(U.view)){go(NAV.find(n=>can(n[0]))[0])}else renderSide();toast(`${t.checked?'Accès autorisé':'Accès retiré'} : ${MODS.find(m=>m[0]===k)[1]} pour ${r}`)}
  else if(t.id==='o-sup')setEta()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').classList.contains('open'))closeDlg();else if(U.menu){U.menu=null;renderTop()}}
  if(e.key==='Enter'&&e.target.id==='pq'){const q=norm(U.pq),l=MEDS.filter(m=>(U.pcat==='Tous'||m.cat===U.pcat)&&(m.bc===U.pq.trim()||norm(m.n).includes(q)));if(l.length===1&&stock(l[0])>0){U.pq='';cartAdd(l[0].id,1)}}});
setInterval(()=>{const c=$('#clock');if(c)c.textContent=ftime(new Date())},20000);

/* ================= démarrage ================= */
$('#app').insertAdjacentHTML('beforeend','<div id="scrim"></div>');
render();
window.__pharma={A,U,MEDS,go,render};
})();
</script></body></html>
